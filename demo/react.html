<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paimon flipbook component · React usage</title>
    <link rel="stylesheet" href="./demo.css" />
    <!-- React 18 的 UMD 构建 + import map：无需打包器即可在浏览器里跑组件 -->
    <script src="./vendor/react.umd.js"></script>
    <script src="./vendor/react-dom.umd.js"></script>
    <script type="importmap">
      {
        "imports": {
          "@bakaomg/paimon-flipbook": "../dist/native.js",
          "@bakaomg/paimon-flipbook/react": "../dist/react.js",
          "react": "./shims/react.js",
          "react-dom/client": "./shims/react-dom-client.js"
        }
      }
    </script>
  </head>
  <body>
    <!-- 与原生版共用同一套 .app 布局与样式 -->
    <div id="root"></div>
    <script type="module" src="../demo-dist/react.js"></script>
